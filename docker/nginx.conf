worker_processes auto;

events {
  worker_connections 1024;
}

# =============================================================================
# The API host.
#
# This machine serves the API, the worker and the database. The landing site and
# the dashboard are deployed separately and reach this over HTTPS, so there is
# exactly one hostname to answer for and one thing to serve.
#
# Change `itdev.cmtc.ac.th` below to your own hostname. nginx does not expand
# environment variables in its configuration, so it is written out rather than
# templated — two occurrences, both marked.
# =============================================================================

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Basic protection for the public API surface
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream app {
    server app:3000;
  }

  # ---------------------------------------------------------------------------
  # Anything arriving on an unrecognised hostname — a scanner walking the IP
  # range, most of all — is dropped without a reply. 444 closes the connection
  # with no response at all, so the host does not advertise what runs here.
  # ---------------------------------------------------------------------------
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  # ---------------------------------------------------------------------------
  # Plain HTTP: only ever used to prove domain ownership to Let's Encrypt and to
  # send everyone else to HTTPS. The session cookie must never travel in clear.
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name itdev.cmtc.ac.th;  # <-- your API hostname

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------------------------------------------------------------------------
  # The API itself.
  #
  # This block needs a certificate to exist before nginx will start, so on a
  # fresh host it stays commented out until certbot has issued one. See
  # DEPLOYMENT.md — the HTTP block above is all that is needed to get the
  # certificate, and this is uncommented immediately afterwards.
  # ---------------------------------------------------------------------------
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name itdev.cmtc.ac.th;  # <-- your API hostname
  #
  #   ssl_certificate     /etc/nginx/certs/live/itdev.cmtc.ac.th/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/live/itdev.cmtc.ac.th/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #
  #   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  #
  #   # Avatar uploads are the largest thing a member sends.
  #   client_max_body_size 2m;
  #
  #   # A health check needs no rate limit and no session.
  #   location = /api/health {
  #     proxy_pass http://app;
  #     proxy_set_header Host $host;
  #   }
  #
  #   location /api/ {
  #     limit_req zone=api burst=40 nodelay;
  #
  #     proxy_pass http://app;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #
  #     # CORS is answered by the application, which holds the allowlist. Setting
  #     # the headers here as well would send two values for one header, and a
  #     # browser rejects that outright — the request fails rather than being
  #     # allowed twice.
  #
  #     # Server-sent events: buffering would hold the stream until it filled,
  #     # and the default read timeout would cut an idle connection between
  #     # heartbeats.
  #     proxy_buffering off;
  #     proxy_read_timeout 3600s;
  #   }
  #
  #   # No pages are served from this host.
  #   location / {
  #     return 404;
  #   }
  # }
}
