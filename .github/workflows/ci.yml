name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copytrade
          POSTGRES_PASSWORD: copytrade
          POSTGRES_DB: copytrade_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copytrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://copytrade:copytrade@localhost:5432/copytrade_ci?schema=public
      REDIS_URL: redis://localhost:6379
      TRADING_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: console
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generated per run rather than written into the file: a workflow should
      # contain no secret-shaped literals at all, real or not.
      - name: Generate ephemeral CI secrets
        run: |
          {
            echo "AUTH_SECRET=$(openssl rand -base64 48)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "MASTER_API_KEY=$(openssl rand -hex 16)"
            echo "MASTER_API_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Check for committed secrets
        run: npm run check:secrets

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Building both targets catches a broken Dockerfile before a deploy does.
      - name: Build web image
        run: docker build --target web -t copytrade-web:ci .

      - name: Build worker image
        run: docker build --target worker -t copytrade-worker:ci .
