<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0dca0" />
      <stop offset="100%" stop-color="#c9a227" />
    </linearGradient>
  </defs>
  <!-- Filled tile rather than an outline: a favicon is rendered at 16px over
       browser chrome that may be light or dark, and a solid ground keeps the
       gold mark legible on both. -->
