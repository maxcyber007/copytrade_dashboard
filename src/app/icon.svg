  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.5" fill="none" stroke="url(#g)" stroke-opacity="0.45" stroke-width="1.5" />
  <path
    d="M6.5 22 L12.5 14.5 L18 19 L25.5 8.5"
    fill="none"
    stroke="url(#g)"
    stroke-width="2.9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="12.5" cy="14.5" r="2.3" fill="url(#g)" />
  <circle cx="18" cy="19" r="2.3" fill="url(#g)" />
</svg>
